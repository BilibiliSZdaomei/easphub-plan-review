name: Provision deployment accounts
run-name: Account delivery ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Random request ID generated by fetch-accounts.sh
        required: true
        type: string
      public_key:
        description: Recipient RSA public key in base64 DER
        required: true
        type: string
permissions: {}
jobs:
  deliver:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Wrap the account configuration for this server
        shell: bash
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          RECIPIENT_DER: ${{ inputs.public_key }}
          ACCOUNT_DATA: ${{ secrets.PLAN_REVIEW_ACCOUNTS_V230 }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$REQUEST_ID" =~ ^[a-f0-9]{32}$ ]]
          [[ "$RECIPIENT_DER" =~ ^[A-Za-z0-9+/=]{350,1100}$ ]]
          mkdir -m 700 -p delivery
          printf '%s' "$RECIPIENT_DER" | base64 -d > "$RUNNER_TEMP/recipient.der"
          openssl rsa -pubin -inform DER -in "$RUNNER_TEMP/recipient.der" -out "$RUNNER_TEMP/recipient.pem" >/dev/null 2>&1
          openssl pkey -pubin -in "$RUNNER_TEMP/recipient.pem" -text -noout | grep -Eq '^Public-Key: \((3072|4096) bit\)'
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess
          package = json.loads(os.environ.pop("ACCOUNT_DATA"))
          bundle = base64.b64decode(package["bundle"], validate=True)
          key = base64.b64decode(package["key"], validate=True)
          target = pathlib.Path("delivery")
          (target / "accounts.easphub").write_bytes(bundle)
          subprocess.run(["openssl", "pkeyutl", "-encrypt", "-pubin", "-inkey",
                          os.path.join(os.environ["RUNNER_TEMP"],"recipient.pem"),
                          "-pkeyopt", "rsa_padding_mode:oaep", "-pkeyopt", "rsa_oaep_md:sha256",
                          "-pkeyopt", "rsa_mgf1_md:sha256", "-out", str(target/"key.wrapped")],
                         input=key, check=True)
          PY
      - name: Make encrypted delivery available for one day
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: provision-${{ inputs.request_id }}
          path: |
            delivery/accounts.easphub
            delivery/key.wrapped
          if-no-files-found: error
          retention-days: 1
