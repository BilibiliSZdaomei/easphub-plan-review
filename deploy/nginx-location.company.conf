# Candidate only: maintainer must review access control, TLS and shared budgets.
# Full incoming URI including the /apps/plan-review/ prefix is forwarded unchanged.
location = /apps/plan-review {
    absolute_redirect off;
    return 308 /apps/plan-review/$is_args$args;
}
location ^~ /apps/plan-review/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $application http://plan-review-company-web:3350;
    proxy_pass $application$request_uri;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    client_max_body_size 21m;
}
