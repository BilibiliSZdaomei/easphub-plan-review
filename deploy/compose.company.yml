name: easphub-plan-review-company
services:
  database:
    extends: {file: compose.yml, service: database}
  web:
    extends: {file: compose.yml, service: web}
    environment:
      DEPLOY_ENV: company
      PLAN_REVIEW_UMAMI_URL: ${PLAN_REVIEW_UMAMI_URL:-}
      PLAN_REVIEW_UMAMI_WEBSITE_ID: ${PLAN_REVIEW_UMAMI_WEBSITE_ID:-}
    networks:
      app-private: {}
      proxy-net:
        aliases: [plan-review-company-web]
  worker:
    extends: {file: compose.yml, service: worker}
    environment:
      DEPLOY_ENV: company
  migrate:
    extends: {file: compose.yml, service: migrate}
    environment:
      DEPLOY_ENV: company
networks:
  proxy-net:
    external: true
    name: proxy-net
  app-private:
    internal: true
secrets:
  database_password:
    file: ${DATABASE_PASSWORD_FILE:?Set an external secret file path}
  database_root_password:
    file: ${DATABASE_ROOT_PASSWORD_FILE:?Set an external secret file path}
  mysql_client:
    file: ${MYSQL_CLIENT_FILE:?Set an external secret file path}
